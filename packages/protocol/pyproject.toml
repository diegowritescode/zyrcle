[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zyrcle-protocol"
version = "0.1.0"
description = "Zyrcle device protocol: signed envelopes, topics and commands shared by the API and the device simulator."
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
dependencies = ["cryptography>=44"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "hypothesis>=6.120", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
