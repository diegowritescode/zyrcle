[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[dependencies]
"@openzeppelin-contracts" = "5.7.0"
forge-std = "1.11.0"

[soldeer]
remappings_generate = false
remappings_location = "txt"
