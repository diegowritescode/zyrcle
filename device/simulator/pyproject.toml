[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zyrcle-sim"
version = "0.1.0"
description = "Simulated Zyrcle container: scale, distance, metal and camera sensors, lock, signed MQTT protocol."
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
dependencies = ["zyrcle-protocol", "aiomqtt>=2.5"]

[project.optional-dependencies]
control = ["fastapi>=0.165", "uvicorn>=0.54"]
dev = ["pytest>=8.3", "ruff>=0.8", "fastapi>=0.165", "httpx>=0.28"]

[project.scripts]
zyrcle-sim = "zyrcle_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
