[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zyrcle-api"
version = "0.1.0"
description = "Zyrcle backend: deposit sessions, device link, verification."
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
dependencies = [
  "fastapi>=0.165",
  "uvicorn[standard]>=0.54",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.32",
  "alembic>=1.20",
  "aiomqtt>=2.5",
  "pydantic-settings>=2.16",
  "eth-account>=0.14",
  "pyjwt>=2.15",
  "web3>=8.0",
  "httpx>=0.28",
  # Below 3: 3.0 replaced send_default_pii with data_collection, and the API stopped starting (ADR 0033).
  "sentry-sdk[fastapi]>=2.40,<3",
  "anthropic>=2.12",
  "openpyxl>=3.1",
  # The monthly certificate's PDF, with its QR (ADR 0046).
  "reportlab>=5.1",
  "zyrcle-protocol",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=1.5", "httpx>=0.28", "asgi-lifespan>=2.1", "hypothesis>=6.120", "ruff>=0.8", "pytest-cov>=7.0"]

[project.scripts]
zyrcle-api = "zyrcle_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zyrcle_api = ["contracts/*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore:enable_cleanup_closed ignored:DeprecationWarning:aiohttp"]
markers = ["integration: needs Postgres and Mosquitto (docker compose -f dev/compose.yml up -d)"]

[tool.coverage.run]
source = ["zyrcle_api"]
omit = ["*/zyrcle_api/contracts/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
