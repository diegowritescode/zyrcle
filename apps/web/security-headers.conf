# Included by every location in nginx.conf.
# 'wasm-unsafe-eval': the QR scanner's WebAssembly decoder (served from /assets, never a CDN).
# media-src data:: the scanner's confirmation beep is an inline data: URI.
# gateway.pinata.cloud: the certificate page reads the certificate's copy on IPFS (ADR 0027).
# *.ingest.*sentry.io: error reports, when the build has a Sentry DSN (ADR 0033).
# Camera only for this origin (QR scanning); everything else off.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://zyrcle-backend.deviego.xyz wss://zyrcle-backend.deviego.xyz https://rpc.zyrcle.deviego.xyz https://gateway.pinata.cloud https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; img-src 'self' data: https://images.unsplash.com; media-src 'self' data: blob: mediastream:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
