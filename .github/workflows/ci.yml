name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Protocol + simulator (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e 'packages/protocol[dev]' -e 'device/simulator[dev]'
      - run: ruff check packages/protocol device/simulator
      - run: ruff format --check packages/protocol device/simulator
      - run: pytest -q packages/protocol/tests device/simulator/tests

  api:
    name: API (lint, migrations, unit + end-to-end tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zyrcle
          POSTGRES_PASSWORD: zyrcle
          POSTGRES_DB: zyrcle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zyrcle" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start Mosquitto with the development ACL
        run: |
          dev/mosquitto/make-passwd.sh
          docker run -d --name mosquitto -p 1883:1883 \
            -v "$PWD/dev/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            -v "$PWD/dev/mosquitto/acl:/mosquitto/config/acl:ro" \
            -v "$PWD/dev/mosquitto/passwd:/mosquitto/config/passwd:ro" eclipse-mosquitto:2
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations apply to an empty database and match the models
        run: |
          alembic upgrade head
          alembic check
      - run: pytest -q

  chain:
    name: Treasury (Foundry tests + ABI drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chain
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: forge soldeer install
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
      - name: The backend uses exactly the compiled contract
        run: |
          python3 export-artifacts.py
          git diff --exit-code -- ../apps/api/src/zyrcle_api/contracts ../apps/api/tests/fixtures

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -q -f apps/api/Dockerfile .
      - run: docker build -q -f apps/web/Dockerfile .
      - run: docker compose -f deploy/compose.yml config -q
        env:
          ZYRCLE_API_TAG: "0000000000000000000000000000000000000000"
          ZYRCLE_WEB_TAG: "0000000000000000000000000000000000000000"
          API_HOST: api.example
          WEB_HOST: web.example
          BLOCKCHAIN_ID: x
          TREASURY: "0x0"
          ORACLE_KEY_PATH: /dev/null
          POSTGRES_PASSWORD: x
          JWT_SECRET: x
          OPERATOR_TOKEN: x
          MQTT_API_PASSWORD: x
          MQTT_CTR_0001_PASSWORD: x
          MQTT_CTR_0002_PASSWORD: x
          MQTT_CTR_0003_PASSWORD: x
          MQTT_CTR_0004_PASSWORD: x

  client:
    name: Shared TS client (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm run build

  infra:
    name: Infra (L1 scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: shellcheck -x infra/l1/scripts/*.sh deploy/*.sh
      - run: python3 -m unittest discover -s infra/l1/scripts -v
      - name: Validator image builds
        run: docker build -q infra/l1/node
