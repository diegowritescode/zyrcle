name: Release images

# Publishes the backend and web images for every commit on main that passed CI, tagged with the
# full commit SHA. Deploying is a separate, manual step: deploy/deploy.sh <sha> <sha> on the VPS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image (API + simulator)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/diegowritescode/zyrcle-api:${{ env.SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web app image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ghcr.io/diegowritescode/zyrcle-web:${{ env.SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - run: |
          echo "### Images for ${SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy on the VPS: \`deploy/deploy.sh ${SHA} ${SHA}\`" >> "$GITHUB_STEP_SUMMARY"
