name: Release images

# Publishes the backend and web images for every commit on main that passed CI, tagged with the
# full commit SHA. Deploying is a separate, manual step: deploy/deploy.sh <sha> <sha> on the VPS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: A manual run publishes only a commit whose CI passed (ADR 0032)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$SHA" \
            --status success --json databaseId --jq length)
          if [ "$passed" -lt 1 ]; then
            echo "CI has not passed for $SHA; not publishing images" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image (API + simulator)
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/diegowritescode/zyrcle-api:${{ env.SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web app image
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # Error reports (ADR 0033): the repository variable SENTRY_DSN_WEB; unset means off.
          build-args: |
            VITE_SENTRY_DSN=${{ vars.SENTRY_DSN_WEB }}
            VITE_RELEASE=${{ env.SHA }}
          tags: ghcr.io/diegowritescode/zyrcle-web:${{ env.SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          {
            echo "### Images for ${SHA}"
            echo "- \`ghcr.io/diegowritescode/zyrcle-api@${API_DIGEST}\`"
            echo "- \`ghcr.io/diegowritescode/zyrcle-web@${WEB_DIGEST}\`"
            echo
            echo "Deploy on the VPS: \`deploy/deploy.sh ${SHA} ${SHA}\`. It pins these digests and records them in \`deploy/history.log\`."
          } >> "$GITHUB_STEP_SUMMARY"
