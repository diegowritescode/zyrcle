# Zyrcle production stack on the VPS. Secrets and image tags live in deploy/.env (see .env.example).
#   docker compose up -d                    run everything
#   docker compose --profile ops run --rm migrate
name: zyrcle

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-api-env: &api-env
  ZYRCLE_DATABASE_URL: postgresql+asyncpg://zyrcle:${POSTGRES_PASSWORD:?}@postgres:5432/zyrcle
  ZYRCLE_MQTT_HOST: mosquitto
  ZYRCLE_MQTT_USERNAME: api
  ZYRCLE_MQTT_PASSWORD: ${MQTT_API_PASSWORD:?}
  ZYRCLE_JWT_SECRET: ${JWT_SECRET:?}
  ZYRCLE_OPERATOR_TOKEN: ${OPERATOR_TOKEN:?}
  ZYRCLE_SIWE_DOMAIN: ${WEB_HOST:?}
  ZYRCLE_CORS_ORIGINS: https://${WEB_HOST}
  ZYRCLE_DEMO_SIMULATOR_URL: http://sim:8090
  ZYRCLE_CHAIN_RPC_URL: http://zyrcle-l1-node-1:9650/ext/bc/${BLOCKCHAIN_ID:?}/rpc
  ZYRCLE_TREASURY_ADDRESS: ${TREASURY:?}
  ZYRCLE_ORACLE_KEY_FILE: /run/secrets/oracle.key
  # The validator node's own health, for the console and the admin alerts (ADR 0028, amendment).
  ZYRCLE_CHAIN_HEALTH_URL: http://zyrcle-l1-node-1:9650/ext/health
  # The Treasury's OPERATOR_ROLE key: records a sale once an operator confirmed the bank match
  # (ADR 0013).
  ZYRCLE_OPERATOR_KEY_FILE: /run/secrets/operator.key
  # Interactive API docs are for development (ADR 0028).
  ZYRCLE_DOCS_ENABLED: "false"
  # Only if "enhanced security for push notifications" is on in the Expo project (ADR 0008).
  ZYRCLE_EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
  # Smart accounts and lost-phone recovery (ADR 0010). Empty: both stay off.
  ZYRCLE_ACCOUNT_FACTORY_ADDRESS: ${ACCOUNT_FACTORY:-}
  ZYRCLE_RESEND_API_KEY: ${RESEND_API_KEY:-}
  ZYRCLE_EMAIL_FROM: ${EMAIL_FROM:-Zyrcle <no-reply@zyrcle.deviego.xyz>}
  # A permanent public copy of each impact certificate on IPFS (ADR 0027, amendment 2026-11-22).
  # Empty: certificates are anchored without it.
  ZYRCLE_PINATA_JWT: ${PINATA_JWT:-}
  # Error reports to Sentry, without personal data (ADR 0033). Empty: off.
  ZYRCLE_SENTRY_DSN: ${SENTRY_DSN_API:-}
  ZYRCLE_RELEASE: ${ZYRCLE_API_TAG:-}

services:
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: unless-stopped
    environment:
      POSTGRES_USER: zyrcle
      POSTGRES_DB: zyrcle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyrcle -d zyrcle"]
      interval: 10s
      retries: 5
    mem_limit: 384m
    logging: *logging
    networks: [internal]

  mosquitto:
    image: eclipse-mosquitto:2.1.4-alpine@sha256:fa12172a051310efe5bcb7a6a11b77bd5faacb82cbacd7742aa758bf024fd8e4
    restart: unless-stopped
    # Run as the host user from the start: with no capabilities it cannot drop root by itself, and
    # this way its password and ACL files can stay 0600.
    user: "${DEPLOY_UID:-1000}:${DEPLOY_GID:-1000}"
    entrypoint: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.runtime:/mosquitto/config/acl:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
    <<: *hardened
    mem_limit: 64m
    logging: *logging
    networks: [internal]

  migrate:
    image: ${ZYRCLE_API_IMAGE:?run deploy/deploy.sh, which pins the image by digest}
    profiles: [ops]
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]

  api:
    image: ${ZYRCLE_API_IMAGE:?run deploy/deploy.sh, which pins the image by digest}
    restart: unless-stopped
    # Runs as the host user so it can read the oracle and operator keys, which stay 0600 files of
    # that user.
    user: "${DEPLOY_UID:-1000}:${DEPLOY_GID:-1000}"
    environment: *api-env
    volumes:
      - ${ORACLE_KEY_PATH:?}:/run/secrets/oracle.key:ro
      - ${OPERATOR_KEY_PATH:?set OPERATOR_KEY_PATH in deploy/.env (ADR 0013)}:/run/secrets/operator.key:ro
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      retries: 5
      start_period: 20s
    <<: *hardened
    mem_limit: 384m
    logging: *logging
    networks: [internal, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.zyrcle-api.rule=Host(`${API_HOST:?}`)
      - traefik.http.routers.zyrcle-api.entrypoints=websecure
      - traefik.http.routers.zyrcle-api.tls.certresolver=le
      - traefik.http.routers.zyrcle-api.middlewares=zyrcle-api-ratelimit
      - traefik.http.middlewares.zyrcle-api-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.zyrcle-api-ratelimit.ratelimit.burst=60
      - traefik.http.services.zyrcle-api.loadbalancer.server.port=8000

  sim:
    image: ${ZYRCLE_API_IMAGE:?}
    restart: unless-stopped
    command: ["zyrcle-sim", "serve", "--broker", "mosquitto", "--keys-dir", "/keys",
              "--devices", "ctr-0001,ctr-0002,ctr-0003,ctr-0004", "--control-port", "8090"]
    environment:
      ZYRCLE_SIM_PASSWORD_CTR_0001: ${MQTT_CTR_0001_PASSWORD:?}
      ZYRCLE_SIM_PASSWORD_CTR_0002: ${MQTT_CTR_0002_PASSWORD:?}
      ZYRCLE_SIM_PASSWORD_CTR_0003: ${MQTT_CTR_0003_PASSWORD:?}
      ZYRCLE_SIM_PASSWORD_CTR_0004: ${MQTT_CTR_0004_PASSWORD:?}
    volumes: [sim-keys:/keys]
    depends_on: { mosquitto: { condition: service_started } }
    <<: *hardened
    mem_limit: 192m
    logging: *logging
    networks: [internal]

  web:
    image: ${ZYRCLE_WEB_IMAGE:?run deploy/deploy.sh, which pins the image by digest}
    restart: unless-stopped
    <<: *hardened
    tmpfs: [/tmp, /var/cache/nginx]
    mem_limit: 64m
    logging: *logging
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.zyrcle-web.rule=Host(`${WEB_HOST}`)
      - traefik.http.routers.zyrcle-web.entrypoints=websecure
      - traefik.http.routers.zyrcle-web.tls.certresolver=le
      - traefik.http.services.zyrcle-web.loadbalancer.server.port=8080

volumes:
  pgdata:
  sim-keys:

networks:
  edge:
    external: true
    name: edge
  internal:
